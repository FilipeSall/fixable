services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fixable
      POSTGRES_PASSWORD: fixable
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixable"]
      interval: 2s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
