services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fixable
      POSTGRES_PASSWORD: fixable
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixable"]
      interval: 2s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: development
      PORT: "3333"
      DATABASE_URL: postgres://fixable:fixable@db:5432/fixable
      APP_ORIGIN: http://localhost:4321
      COOKIE_SECURE: "false"
      TRUST_PROXY_HOPS: "0"
      MAIL_DRIVER: smtp
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: Fixable <nao-responda@fixable.local>
      TEAM_EMAIL: equipe@fixable.local
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
