services:
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1::8025"

  api:
    depends_on:
      mailpit:
        condition: service_started
    environment:
      TOKEN_RATE_LIMIT: ${TOKEN_RATE_LIMIT:?defina TOKEN_RATE_LIMIT no .env.smoke}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:?defina LOGIN_RATE_LIMIT no .env.smoke}
