services:
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    environment:
      MP_WEBROOT: emails
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:?gere a linha MAILPIT_UI_AUTH com bash deploy/mailpit-auth.sh}
      MP_MAX_MESSAGES: "500"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  api:
    depends_on:
      mailpit:
        condition: service_started
    environment:
      SMTP_URL: smtp://mailpit:1025

  web:
    volumes:
      - ./mailpit.caddy:/etc/caddy/extra/mailpit.caddy:ro
